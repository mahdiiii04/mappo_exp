seed: 0

train:
  num_epochs: 30
  minibatch_size: 4096
  lr: 5e-5
  max_grad_norm: 40.0
  device: ???

env:
  max_steps: 100
  scenario_name: "balance"
  # Set to true to use the dynamic-goal variant (goal teleports mid-episode)
  dynamic_goal: true
  scenario:
    n_agents: 3
    # --- dynamic goal knobs (only used when dynamic_goal: true) ---
    # How many steps between goal relocations (per environment independently)
    goal_move_every: 25
    # X range for the new goal position
    goal_move_x_low: -1.0
    goal_move_x_high: 1.0
    # Y range for the new goal position (0 = floor level, y_semidim = top)
    goal_move_y_low: 0.0
    # goal_move_y_high defaults to world.y_semidim if not set here
  device: ???
  num_envs: ??

model:
  shared_params: False
  centralised_critic: True

collector:
  frames_per_batch: 60_000
  n_iters: 500
  total_frames: ???

buffer:
  memory_size: ???

loss:
  gamma: 0.99
  lmbda: 0.9
  entropy_eps: 0.01
  clip_epsilon: 0.2

eval: 
  frequency: 10

logger: